name: Publish upstream development image
jobs:
  docker-dev:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: 0.12.10
        enable-cache: true
    - name: Verify committed dependency resolution
      run: uv lock --check
    - name: Log in to GHCR
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.3.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
    - name: Build & push multi-arch :dev image
      uses: docker/build-push-action@v7.3.0
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ghcr.io/${{ github.repository_owner }}/wizarr:dev
    if: github.repository == 'wizarrrr/wizarr'
    timeout-minutes: 30
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: publish-dev.yml-${{ github.ref }}
  cancel-in-progress: false
