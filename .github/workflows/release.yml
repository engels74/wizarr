name: wizarr-release
jobs:
  stable-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: 0.12.10
        enable-cache: true
    - name: Verify committed dependency resolution
      run: uv lock --check
    - name: Determine version
      id: version
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          VERSION="$REQUESTED_VERSION"
          if [[ "$VERSION" == "latest" ]]; then
            # Get version from pyproject.toml
            VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/' || echo "latest")
          fi
        else
          # From release event
          VERSION="$RELEASE_TAG"
        fi

        [[ $VERSION == latest || $VERSION =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "Building version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        # Set tag name (with v prefix for non-latest)
        if [[ "$VERSION" == "latest" ]]; then
          echo "tag_name=latest" >> "$GITHUB_OUTPUT"
        elif [[ "$VERSION" =~ ^v.* ]]; then
          echo "tag_name=$VERSION" >> "$GITHUB_OUTPUT"
        else
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"
        fi
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
    - name: Log in to GHCR
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.3.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
    - name: Build & push stable release image
      uses: docker/build-push-action@v7.3.0
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/${{ github.repository_owner }}/wizarr:latest
          ghcr.io/${{ github.repository_owner }}/wizarr:${{ steps.version.outputs.tag_name }}
        build-args: APP_VERSION=${{ steps.version.outputs.version }}
    if: github.repository == 'wizarrrr/wizarr'
    timeout-minutes: 30
'on':
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g., v2025.9.1 or latest)
        required: false
        default: latest
permissions:
  contents: read
concurrency:
  group: release.yml-${{ github.ref }}
  cancel-in-progress: false
