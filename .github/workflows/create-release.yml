name: Create Release
jobs:
  create-release:
    runs-on: ubuntu-24.04
    if: "github.repository == 'wizarrrr/wizarr' && (github.event.pull_request.merged == true && \nstartsWith(github.event.pull_request.title,\
      \ 'Release v') &&\ngithub.repository_owner == 'wizarrrr')"
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        persist-credentials: false
    - name: Extract version from PR title
      id: version
      run: |-
        VERSION="${PR_TITLE#Release v}"
        [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
    - name: Create GitHub Release
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        # Save PR body to file to avoid shell injection
        printf '%s\n' "$PR_BODY" > pr_body.md

        # Extract changelog from PR body (remove the footer)
        sed '/^---$/,$d' pr_body.md > changelog.md

        # Create the release (explicitly published, not draft)
        echo "Creating published release ${{ steps.version.outputs.tag }}..."
        gh release create "${{ steps.version.outputs.tag }}" \
          --title "${{ steps.version.outputs.tag }}" \
          --notes-file changelog.md \
          --latest

        # Verify the release was published (not draft)
        RELEASE_INFO=$(gh release view "${{ steps.version.outputs.tag }}" --json isDraft,url)
        IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.isDraft')
        RELEASE_URL=$(echo "$RELEASE_INFO" | jq -r '.url')

        if [[ "$IS_DRAFT" == "true" ]]; then
          echo "❌ ERROR: Release was created as draft! This will not trigger wizarr-release workflow."
          exit 1
        else
          echo "✅ Release successfully published and will trigger wizarr-release workflow"
        fi

        echo "html_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
    - name: Summary
      run: |
        {
          echo "🎉 **Release Created & Published!**"
          echo ""
          echo "- **Version**: ${{ steps.version.outputs.tag }}"
          echo "- **Release URL**: ${{ steps.create_release.outputs.html_url }}"
          echo ""
          echo "## What happens next:"
          echo "1. ⚙️ **wizarr-release** workflow is now triggered (Docker build)"
          echo "2. 📦 Docker images built for linux/amd64 and linux/arm64"
          echo "3. 🏷️ Images tagged as \`:latest\` and \`:${{ steps.version.outputs.version }}\`"
          echo "4. 🚀 Images pushed to ghcr.io/${{ github.repository_owner }}/wizarr"
        } >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 30
'on':
  pull_request:
    branches:
    - main
    types:
    - closed
permissions:
  contents: read
concurrency:
  group: create-release.yml-${{ github.ref }}
  cancel-in-progress: false
